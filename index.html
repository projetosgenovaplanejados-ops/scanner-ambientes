<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183d34"><title>Scanner de ambientes</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f2eb;color:#183d34;font:16px system-ui}main{max-width:560px;margin:auto;padding:28px 18px}h1{font:500 36px Georgia;margin:0 0 20px}section{background:white;border:1px solid #d7dfd6;border-radius:14px;padding:18px;margin-bottom:14px}h2{font-size:20px;margin:0 0 10px}button,input{font:inherit;padding:12px;border-radius:8px}button{background:#205343;color:white;border:0;cursor:pointer;margin:4px 0}button:disabled{opacity:.45}input{width:100%;border:1px solid #9daea2;margin:5px 0 10px}label{display:block}p,li{line-height:1.45}#strip{display:flex;flex-wrap:wrap;gap:6px}#strip img{width:64px;height:64px;object-fit:cover}#hud:xr-overlay{position:absolute;inset:auto 10px 16px;background:#183d34;color:white;padding:12px;border-radius:12px}#hud:empty{display:none}a{color:inherit}
</style><main><h1>Scanner de ambientes</h1><section><label>Nome do ambiente<input id="room" value="Cozinha" maxlength="80"></label><h2>Varredura 3D</h2><p>Faça uma varredura por ambiente. Caminhe devagar e mantenha superfícies visíveis. Exporte os pontos antes de fechar a página.</p><button id="scan">Iniciar captura 3D</button> <button id="ply" disabled>Salvar nuvem PLY</button><p id="status" role="status"></p></section>
<section><h2>Levantamento de campo</h2><p>Registre fotos e medidas de trena para acompanhar o levantamento.</p><label>Fotos do ambiente<input id="photo" type="file" accept="image/*" capture="environment"></label><div id="strip"></div><form id="measure"><label>O que foi medido<input id="label" required placeholder="Vão da geladeira" maxlength="100"></label><label>Medida da trena (mm)<input id="mm" required type="number" min="0.1" step="any" inputmode="decimal"></label><button>Adicionar medida</button></form><ul id="list"></ul><button id="report">Salvar ficha com fotos</button></section></main><div id="hud"></div><script src="app.js"></script></html>
